name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: suite (in devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build the devcontainer (EigenScript pinned by .devcontainer/Dockerfile's
      # EIGS_REF) and run the full suite inside it — the same image a Codespace
      # opens. tests/run.sh builds the Lua 5.4.9 reference inside the image and
      # grades bin/eigenlua against the corpus and LEDGER.md (hq#58: this is the
      # required check, so the product grade lives here, not in its own job).
      - name: Build devcontainer and run suite
        uses: devcontainers/ci@v0.3
        with:
          runCmd: EIGS=eigenscript bash tests/run.sh
